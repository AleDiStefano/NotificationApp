spring.application.name=notificationapp

# --- Base de datos (PostgreSQL) ---
# Valores tomados de variables de entorno / .env (ver .env.example).
# En 'spring-boot:test-run' y en los tests, Testcontainers levanta la DB y
# @ServiceConnection sobrescribe estas propiedades automaticamente.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/notificaciones_db}
spring.datasource.username=${DATABASE_USERNAME:notificaciones_user}
spring.datasource.password=${DATABASE_PASSWORD:cambiame123}

# --- JPA / Hibernate ---
# 'update' alcanza para desarrollo; para produccion migrar a Flyway/Liquibase.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# --- Seguridad (stopgap HTTP Basic hasta implementar JWT) ---
# Usuario admin en memoria; ver SecurityConfig. Reemplazar por JWT + UserRepository.
app.admin.username=${APP_ADMIN_USER:admin}
app.admin.password=${APP_ADMIN_PASSWORD:admin}

# --- Actuator ---
management.endpoints.web.exposure.include=health,info
# RabbitMQ ya se usa para la entrega de notificaciones: el healthcheck del
# broker refleja el estado real (no se deshabilita mas).

# --- OpenAPI / Swagger UI ---  ->  http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.display-request-duration=true

# --- RabbitMQ: reintentos con backoff antes de dar la entrega por fallida ---
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-retries=3
spring.rabbitmq.listener.simple.retry.initial-interval=2000
spring.rabbitmq.listener.simple.retry.multiplier=2.0
spring.rabbitmq.listener.simple.retry.max-interval=10000
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# --- Email (SMTP) ---
# Por defecto apunta a MailHog (ver docker-compose.yml) para poder ver los
# correos en http://localhost:8025 sin necesitar credenciales reales.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
app.mail.from=${MAIL_FROM:no-reply@notificationapp.local}
